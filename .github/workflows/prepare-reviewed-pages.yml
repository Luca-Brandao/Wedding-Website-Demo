name: Validate reviewed portfolio build
on:
  push:
    branches: ["codex/refresh-wedding-pages-20261125"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts
      - name: Check dependencies
        run: npm audit
      - name: Compile and prepare static Pages files
        run: npm run build
      - name: Report public static build for authorised publication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root = path.resolve('docs');
          function walk(folder) {
            for (const entry of fs.readdirSync(folder, { withFileTypes: true })) {
              const target = path.join(folder, entry.name);
              if (entry.isDirectory()) { walk(target); continue; }
              if (!entry.isFile()) throw new Error('Unexpected build entry');
              const data = fs.readFileSync(target);
              const name = 'docs/' + path.relative(root, target).split(path.sep).join('/');
              const encoded = data.toString('base64');
              const sha = crypto.createHash('sha1').update('blob ' + data.length + '\0').update(data).digest('hex');
              console.log('PORTFOLIO_ASSET_META ' + JSON.stringify({ path: name, sha, size: data.length, chunks: Math.ceil(encoded.length / 6000) }));
              for (let index = 0; index < encoded.length; index += 6000) console.log('PORTFOLIO_ASSET_CHUNK ' + JSON.stringify({ path: name, index: index / 6000, data: encoded.slice(index, index + 6000) }));
            }
          }
          walk(root);
          NODE
